name: Tests

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "_conf_schema.json"
      - ".astrbot-plugin/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.py"
      - "_conf_schema.json"
      - ".astrbot-plugin/**"
      - ".github/workflows/tests.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Tests' }}

jobs:
  test-429:
    name: Pytest (Python 3.12, AstrBot 4.29.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astrbot==4.29.4" pytest

      - name: Run 4.29 compatibility tests
        env:
          ASTRBOT_ROOT: ${{ runner.temp }}/astrbot-test-data
        run: pytest -q tests/test_astrbot_429_compat.py

  test-430:
    name: Pytest (Python 3.12, AstrBot 4.30.0-beta.2)
    needs: test-429
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astrbot==4.30.0b2" pytest

      - name: Run full test suite
        env:
          ASTRBOT_ROOT: ${{ runner.temp }}/astrbot-test-data
        run: pytest -q
