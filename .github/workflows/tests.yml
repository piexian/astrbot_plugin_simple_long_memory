name: Tests

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "_conf_schema.json"
      - ".astrbot-plugin/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.py"
      - "_conf_schema.json"
      - ".astrbot-plugin/**"
      - ".github/workflows/tests.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            "pyyaml==6.0.2" \
            "sqlalchemy[asyncio]" \
            sqlmodel \
            aiosqlite \
            apscheduler \
            faiss-cpu \
            numpy

      - name: Run pytest
        run: pytest -q
