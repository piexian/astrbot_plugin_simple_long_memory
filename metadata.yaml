name: astrbot_plugin_simple_long_memory
display_name: 简单长期记忆
desc: 为 AstrBot 提供长期记忆能力，基于内置知识库实现用户偏好、历史交互和重要事实的记忆存储与召回
version: v0.6.3
author: piexian
repo: https://github.com/piexian/astrbot_plugin_simple_long_memory
category: ai_context
astrbot_version: ">=4.29.4"
views:
  - name: memory_review
    target: chat_message
    title: 记忆待审列表
    description: 审核后台记忆整理产生的争议操作
    version: 1
    actions:
      - approve
      - reject
